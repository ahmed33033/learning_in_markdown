<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      h1 {
        background-color: blue;
      }
    </style>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <h1>Hi there</h1>
    <p style="color: aqua">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio consectetur dicta sequi laborum voluptas?
      Beatae placeat suscipit nulla voluptate blanditiis aliquam ipsam? Neque culpa quod eius, repellendus voluptatibus
      adipisci nostrum?
    </p>

    <form action="/" method="get">
      <p>
        <label for="name_tag">Your name:</label>
        <input type="text" id="name_tag" name="user_name" value="some default value..." class="tags" />
      </p>

      <p>
        <label for="your_email">Your Email!</label>
        <input type="email" id="your_email" name="user_email" class="tags" />
      </p>

      <p>
        <label for="my_text">Your thoughts and concerns:</label>
        <textarea id="my_text" name="user_thoughts">
                Type something here...
        </textarea>
      </p>

      <button type="submit">Submit!</button>
    </form>
  </body>
</html>
